name: check-firewall

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: make check-firewall
        run: make check-firewall
